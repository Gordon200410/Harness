async function runAll(){

function doExport(){setMtext(JSON.stringify({files:S.files,features:S.features,cfg:{...S.cfg,providers:{...S.cfg.providers,gemini:{key:"",key2:""}}}},null,2));setModal("export")}
function doImport(){try{const j=JSON.parse(mtext);if(!j.files||!Array.isArray(j.features))throw new Error("格式不對");if(j.features.filter(f=>f.status==="active").length>1)throw new Error("同一時間只能有一張進行中的票");
  setS(s=>({files:j.files,features:j.features,cfg:j.cfg?cleanCfg({...j.cfg,providers:{...j.cfg.providers,gemini:s.cfg.providers.gemini}}):s.cfg}));setModal(null);L("Harness Gate Check","已匯入")}catch(e){alert("匯入失敗："+e.message)}}

const outText=f=>"# "+f.id+" "+f.title+"\n\n驗收條件："+f.acceptance+"\n\n## Builder 產出\n\n"+f.builderOut+(f.evalReport?"\n\n## QA 報告\n\n"+f.evalReport:"")+"\n";
async function copyOut(f){
  try{await navigator.clipboard.writeText(outText(f));L("Harness Gate Check","已複製 "+f.id+" 的內容到剪貼簿")}
  catch(e){setMtext(outText(f));setModal("export");L("Harness Gate Check","沒辦法直接複製，已開啟視窗，請自己全選後複製")}}
function dlOut(f){
  try{const u=URL.createObjectURL(new Blob([outText(f)],{type:"text/markdown;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=f.id+".md";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);L("Harness Gate Check","已下載 "+f.id+".md")}
  catch(e){setMtext(outText(f));setModal("export");L("Harness Gate Check","沒辦法下載，已開啟視窗，請自己複製")}}
const pct=Math.min(100,((act&&act.steps||0)/CAP)*100);
const stage=!act?-1:!act.builderOut?0:!act.evalReport?1:2;
const fail=stage===2;
const roleName=sess.role==="idle"?"待命":sess.role==="Evaluator"?"Evaluator · 嚴格把關":sess.role;
const Btn=({n,t,s,c,fn})=><button disabled={busy||auto} onClick={fn} className={"text-left rounded-xl px-3 py-3 border border-[#27272a] bg-[#111113] active:bg-[#18181b] disabled:opacity-40 "}><div className="flex items-center gap-2"><span className={"mono text-[11px] w-5 h-5 rounded-md flex items-center justify-center "+c}>{n}</span><span className="text-[14px] font-medium">{t}</span></div><div className="text-[11px] text-zinc-500 mt-0.5 pl-7 truncate">{s}</div></button>;
const Seg=({k,t})=><button onClick={()=>setView(k)} className={"px-5 py-2.5 rounded-md text-[14px] "+(view===k?"bg-[#27272a] text-zinc-100":"text-zinc-400")}>{t}</button>;
const fcard=f=><div key={f.id} className={card+" p-3 space-y-2"}>
  <div className="flex items-center gap-2"><span className={"w-1.5 h-1.5 rounded-full "+DOT[f.status]}/><span className="mono text-[11px] text-zinc-400">{f.id}</span></div>
  <div className="text-[14px] leading-snug">{f.title}</div>
  <div className="text-[13px] text-zinc-500 leading-snug">{f.acceptance}</div>
  <div className="mono text-[11px] text-zinc-500">{f.steps||0} 步 · ~{f.tokens||0} tok · {Math.round((f.ms||0)/1000)}s</div>
  <div className="flex gap-2">
   {f.status==="not_started"&&<button disabled={!!act} onClick={()=>start(f.id)} className="px-4 py-2.5 rounded-lg text-[13px] bg-indigo-500 text-white disabled:bg-[#18181b] disabled:text-zinc-600">{act?"已有進行中的票":"開始"}</button>}
   {(f.status==="active"||f.status==="not_started")&&<button onClick={()=>patch(f.id,{status:"blocked"})} className="px-4 py-2.5 rounded-lg text-[13px] border border-[#27272a] text-zinc-300">擱置</button>}
   {f.status==="blocked"&&<button onClick={()=>patch(f.id,{status:"not_started"})} className="px-4 py-2.5 rounded-lg text-[13px] border border-[#27272a] text-zinc-300">取消擱置</button>}</div>
  {f.builderOut&&<div className="flex gap-2"><button onClick={()=>copyOut(f)} className="px-4 py-2.5 rounded-lg text-[13px] border border-[#27272a] text-zinc-300">複製內容</button><button onClick={()=>dlOut(f)} className="px-4 py-2.5 rounded-lg text-[13px] border border-[#27272a] text-zinc-300">下載檔案</button></div>}</div>;

return <div className="h-full relative flex text-[14px]">
{side&&<aside className="w-52 shrink-0 border-r border-[#1f1f23] flex flex-col bg-[#0c0c0e]">
 <div className="px-4 pt-4 pb-3"><div className="font-semibold tracking-tight text-[15px]">Harness</div><div className={lbl+" mt-0.5"}>System of record</div></div>
 <nav className="flex-1 overflow-auto px-2 space-y-0.5">{FILES.map(([k,n])=><button key={k} onClick={()=>{setTab(k);setView("files");if(window.innerWidth<900)setSide(false)}} className={"w-full text-left px-3 py-2.5 rounded-lg flex items-center "+(view==="files"&&tab===k?"bg-[#18181b] text-zinc-100":"text-zinc-400")}><span className="mono text-[12px] truncate">{n}</span>{k==="feature_list"&&<span className="ml-auto mono text-[11px] text-zinc-500">{S.features.filter(f=>f.status==="passing").length}/{S.features.length}</span>}</button>)}</nav>
 <div className="p-2 space-y-1.5 border-t border-[#1f1f23]"><button onClick={doExport} className="w-full py-2 rounded-lg border border-[#27272a] text-zinc-300">匯出備份</button><button onClick={()=>{setMtext("");setModal("import")}} className="w-full py-2 rounded-lg border border-[#27272a] text-zinc-300">匯入備份</button><button onClick={resetProject} className="w-full py-2 rounded-lg border border-[#27272a] text-rose-300">清空專案</button></div>
</aside>}
<main className="flex-1 min-w-0 flex flex-col">
 <header className="px-4 py-3 border-b border-[#1f1f23] flex items-center gap-3"><button onClick={()=>setSide(!side)} className="px-4 rounded-lg border border-[#27272a] text-zinc-300">☰</button>
  <div className="flex bg-[#111113] border border-[#1f1f23] rounded-lg p-0.5"><Seg k="run" t="執行"/><Seg k="board" t="看板"/><Seg k="files" t="檔案"/></div>
  <div className="flex items-center gap-2 min-w-0"><span className={"w-1.5 h-1.5 rounded-full "+(sess.role==="idle"?"bg-zinc-500":sess.role==="Evaluator"?"bg-rose-400":sess.role==="Builder"?"bg-indigo-400":"bg-violet-400")}/><span className="text-zinc-300 truncate">{roleName}</span></div>
  <span className="ml-auto mono text-[11px] text-zinc-500">~{sess.tokens} tok</span>
  <button onClick={()=>setRight(!right)} className="px-3 py-1.5 rounded-lg border border-[#27272a] text-zinc-300">設定</button>
 </header>
 <div className="flex-1 min-h-0 overflow-auto">
 {view==="run"&&<div className="p-4 space-y-4 max-w-4xl">
  <div className={card+" p-4 space-y-3"}>
   <div className="flex items-baseline gap-2"><span className={lbl}>進行中</span><span className="truncate">{act?<><span className="mono text-zinc-400">{act.id}</span> {act.title}</>:<span className="text-zinc-500">目前沒有進行中的票</span>}</span><span className="ml-auto mono text-[11px] text-zinc-500">{act&&act.steps||0}/{CAP}</span></div>
   <div className="h-1 rounded bg-[#1f1f23]"><div className={"h-1 rounded "+(pct>80?"bg-rose-400":"bg-indigo-400")} style={{width:pct+"%"}}/></div>
   <div className="flex items-center">{STAGES.map((s,i)=><React.Fragment key={s}><div className="flex items-center gap-1.5"><span className={"w-2 h-2 rounded-full "+(i<stage?"bg-emerald-400":i===stage?(fail?"bg-rose-400":"bg-indigo-400"):"bg-[#27272a]")}/><span className={"text-[12px] "+(i<=stage?"text-zinc-200":"text-zinc-600")}>{s}{i===2&&fail?"沒過":""}</span></div>{i<3&&<div className={"flex-1 h-px mx-2 "+(i<stage?"bg-emerald-400/50":"bg-[#27272a]")}/>}</React.Fragment>)}</div>
  </div>
  <div className="space-y-3">
   {log.length===0&&<div className="text-zinc-500 py-8 text-center">執行紀錄會顯示在這裡。可以依序按下方的 1、2、3，或直接按「任務開始」。</div>}
   {log.map((e,i)=><div key={i} className="flex gap-3"><span className={"mt-1.5 w-1.5 h-1.5 rounded-full shrink-0 "+(TAGDOT[e.tag]||"bg-zinc-500")}/><div className="min-w-0"><div className={lbl}>{TAGZH[e.tag]||e.tag}</div><pre className="whitespace-pre-wrap break-words text-[14px] leading-relaxed text-zinc-300 mt-0.5" style={{fontFamily:"inherit"}}>{e.text}</pre></div></div>)}
   {busy&&<div className="text-zinc-500 animate-pulse pl-5">處理中…</div>}<div ref={endRef}/></div>
 </div>}
 {view==="board"&&<div className="p-4 grid grid-cols-4 gap-3 items-start min-w-[760px]">{COLS.map(([k,n])=><div key={k} className="space-y-2">
   <div className="flex items-center gap-2 px-1"><span className={"w-1.5 h-1.5 rounded-full "+DOT[k]}/><span className={lbl}>{n}</span>{k==="not_started"&&S.cfg.auto&&S.cfg.auto.next&&<span className="text-[10px] text-indigo-300">自動接著做</span>}<span className="mono text-[11px] text-zinc-600">{S.features.filter(f=>f.status===k).length}{k==="active"?"/1":""}</span></div>
   {S.features.filter(f=>f.status===k).map(fcard)}</div>)}</div>}
 {view==="files"&&<div className="p-4 h-full flex flex-col gap-2"><div className="flex items-center"><span className="mono text-[12px] text-zinc-400">{FILES.find(f=>f[0]===tab)[1]}</span>{tab==="feature_list"&&<button onClick={saveRaw} className="ml-auto px-3 py-1.5 rounded-lg bg-indigo-500 text-white">儲存（會先檢查格式）</button>}</div>
  {tab==="feature_list"?<textarea value={raw} onChange={e=>setRaw(e.target.value)} className={inp+" flex-1 mono text-[12px] leading-relaxed"}/>:<textarea value={S.files[tab]} onChange={e=>setFiles(tab,e.target.value)} className={inp+" flex-1 mono text-[12px] leading-relaxed"}/>}</div>}
 </div>
 <footer className="p-3 border-t border-[#1f1f23] space-y-2">
  <div className="flex gap-2"><input value={req} onChange={e=>setReq(e.target.value)} className={inp} placeholder="寫下你想做的需求，交給 Planner 拆成小任務"/>{auto&&<button onClick={()=>{stopRef.current=true;L("Harness Gate Check","好，這一步做完就會停下來")}} className="shrink-0 px-4 py-2.5 rounded-xl border border-rose-400/40 text-rose-300">停止</button>}<button disabled={busy||auto} onClick={runAll} className="shrink-0 pl-4 pr-5 py-2.5 rounded-xl text-white font-medium disabled:opacity-70 flex items-center gap-2.5 border border-indigo-300/30 active:scale-[0.98] transition" style={{background:"linear-gradient(180deg,#6366f1,#4f46e5)",boxShadow:"0 8px 24px -10px rgba(99,102,241,.7), inset 0 1px 0 rgba(255,255,255,.18)"}}>{auto?<span className="w-2 h-2 rounded-full bg-white animate-pulse"/>:<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 1.2v9.6L10.8 6z" fill="currentColor"/></svg>}<span className="whitespace-nowrap">{auto?"執行中 · "+autoStep:"任務開始"}</span></button></div>
  <div className="grid grid-cols-4 gap-2">
   <Btn n="1" t="Planner" s="把需求拆成小任務" c="bg-violet-500/20 text-violet-300" fn={runPlanner}/>
   <Btn n="2" t="Builder" s="執行進行中的那張票" c="bg-indigo-500/20 text-indigo-300" fn={runBuilder}/>
   <Btn n="3" t="Evaluator" s="嚴格檢查做得對不對" c="bg-rose-500/20 text-rose-300" fn={runEval}/>
   <Btn n="4" t="交接" s="存下進度，開新一輪" c="bg-zinc-500/20 text-zinc-300" fn={handoff}/></div>
 </footer>
</main>
{right&&<div className="absolute inset-0 z-30 bg-black/50" onClick={()=>setRight(false)}/>}{right&&<aside className="absolute inset-y-0 right-0 z-40 w-[26rem] max-w-full shadow-2xl border-l border-[#1f1f23] bg-[#0c0c0e] overflow-auto p-4 space-y-5">
 <div className="flex items-center"><span className="font-semibold">模型設定</span><button onClick={()=>setRight(false)} className="ml-auto px-4 rounded-lg border border-[#27272a] text-zinc-300">關閉</button></div>
 <div className="space-y-2"><div className={lbl}>自動化（只對「任務開始」有效）</div>
 {[["next","通過後自動做下一張","Evaluator 驗收通過後，自動接著做下一張票，直到待辦清空"],["retry","沒通過就自動重做","沒通過時，把 QA 報告交給 Builder 修正後再驗收，直到通過；但每張票最多 25 步，到了就會停下來"]].map(([k,t,d])=><label key={k} className={card+" p-2.5 flex items-start gap-2.5"}><input type="checkbox" className="mt-0.5" checked={!!(S.cfg.auto&&S.cfg.auto[k])} onChange={e=>setCfg(c=>{c.auto=c.auto||{};c.auto[k]=e.target.checked})}/><span><span className="block text-zinc-200">{t}</span><span className="block text-[11px] text-zinc-500 mt-0.5 leading-snug">{d}</span></span></label>)}</div>
 <div className="space-y-2"><div className={lbl}>Gemini API Key（兩組，只存在這台裝置）</div><input type="password" placeholder="Key A（GEMINI_API_KEY）" value={S.cfg.providers.gemini.key} onChange={e=>setCfg(c=>{c.providers.gemini.key=e.target.value})} className={inp}/><input type="password" placeholder="Key B（第二組，可留空）" value={S.cfg.providers.gemini.key2||""} onChange={e=>setCfg(c=>{c.providers.gemini.key2=e.target.value})} className={inp}/></div>
 <div className="space-y-2"><div className={lbl}>openai_compatible</div><input placeholder="base_url" value={S.cfg.providers.openai.url} onChange={e=>setCfg(c=>{c.providers.openai.url=e.target.value})} className={inp}/><input type="password" placeholder="api_key" value={S.cfg.providers.openai.key} onChange={e=>setCfg(c=>{c.providers.openai.key=e.target.value})} className={inp}/></div>
 <div className="space-y-2"><div className={lbl}>各角色用哪個模型</div><datalist id="models"><option value="gemini-2.5-pro"/><option value="gemini-2.5-flash"/></datalist>
  {["Planner","Builder","Evaluator"].map(r=><div key={r} className={card+" p-2.5 space-y-1.5"}><div className="text-zinc-300">{r}</div>
   <select value={S.cfg.roles[r].provider} onChange={e=>setCfg(c=>{c.roles[r].provider=e.target.value})} className={inp}><option>gemini_api</option><option>openai_compatible</option></select>
   {S.cfg.roles[r].provider==="gemini_api"?<select value={S.cfg.roles[r].model} onChange={e=>setCfg(c=>{c.roles[r].model=e.target.value})} className={inp+" mono"}>{(GM.includes(S.cfg.roles[r].model)?GM:[S.cfg.roles[r].model,...GM]).map(m=><option key={m} value={m}>{m}</option>)}</select>:<input list="models" value={S.cfg.roles[r].model} onChange={e=>setCfg(c=>{c.roles[r].model=e.target.value})} className={inp+" mono"}/>}
   {S.cfg.roles[r].provider==="gemini_api"&&<div className="flex items-center gap-2"><span className={lbl+" shrink-0"}>API Key</span><div className="flex flex-1 bg-[#111113] border border-[#1f1f23] rounded-lg p-0.5">{[["1","Key A"],["2","Key B"]].map(([v,n])=><button key={v} onClick={()=>setCfg(c=>{c.roles[r].keySlot=v})} className={"flex-1 py-2 rounded-md "+((S.cfg.roles[r].keySlot||"1")===v?"bg-[#27272a] text-zinc-100":"text-zinc-400")}>{n}{v==="2"&&!S.cfg.providers.gemini.key2?"（未填）":""}</button>)}</div></div>}
   <div className="flex items-center gap-2 pt-0.5"><span className={lbl+" shrink-0"}>思考程度</span><select value={S.cfg.roles[r].think||""} onChange={e=>setCfg(c=>{c.roles[r].think=e.target.value})} className={inp}><option value="">模型預設</option><option value="minimal">minimal</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></div></div>)}</div>
 <div className="space-y-2"><div className="flex items-center gap-1"><span className={lbl+" mr-auto"}>給模型的內容預覽</span>{["Planner","Builder","Evaluator"].map(r=><button key={r} onClick={()=>setPv(r)} className={"px-3 py-2 rounded-md text-[12px] "+(pv===r?"bg-[#27272a] text-zinc-100":"text-zinc-500")}>{r}</button>)}</div>
  <pre className={card+" mono text-[11px] whitespace-pre-wrap p-2.5 max-h-72 overflow-auto text-zinc-400"}>{"[System]\n"+SYS[pv]+"\n\n"+ctxText(pv)}</pre></div>
</aside>}
{modal&&<div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50"><div className={card+" w-full max-w-xl p-4 space-y-3"}>
 <div className="font-semibold">{modal==="export"?"匯出備份（複製後貼到另一台裝置）":"貼上備份內容（JSON）"}</div>
 <textarea value={mtext} onChange={e=>setMtext(e.target.value)} readOnly={modal==="export"} className={inp+" h-64 mono text-[12px]"}/>
 <div className="flex gap-2 justify-end"><button onClick={()=>setModal(null)} className="px-4 py-2 rounded-lg border border-[#27272a] text-zinc-300">關閉</button>
 {modal==="export"?<button onClick={()=>{try{navigator.clipboard.writeText(mtext)}catch(e){}}} className="px-4 py-2 rounded-lg bg-indigo-500 text-white">複製</button>:<button onClick={doImport} className="px-4 py-2 rounded-lg bg-indigo-500 text-white">匯入</button>}</div></div></div>}
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
